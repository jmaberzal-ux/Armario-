<title>Mi Armario Diario</title>
<style>
:root{
  --bg:#0b0b0d;--s1:#141417;--s2:#1b1b1f;--s3:#26262b;--s4:#313137;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --tx:#f2f2f4;--tx2:#a3a3ab;--tx3:#6d6d75;
  --ac:#d9a86c;--ac2:#f0c58c;--actx:#1c1409;--acbg:rgba(217,168,108,.14);
  --ok:#32d74b;--warn:#ffb340;--bad:#ff5a4e;
  --r:18px;--r2:14px;--r3:12px;--tabh:58px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overscroll-behavior:none}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-align:inherit}
input{font:inherit;font-size:16px;color:var(--tx)}
a{color:inherit}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
#main{position:fixed;top:0;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 14px) calc(16px + var(--sar)) 28px calc(16px + var(--sal))}
#main.conbarra{padding-bottom:108px}
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal);display:flex;background:rgba(14,14,17,.88);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border-top:1px solid var(--line);z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;text-align:center}
#tabs button .ico{width:25px;height:25px}
#tabs button.on{color:var(--ac)}
#barra{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));padding:16px calc(16px + var(--sar)) 12px calc(16px + var(--sal));display:none;gap:10px;background:linear-gradient(to top,var(--bg) 60%,rgba(11,11,13,0));z-index:15}
#barra.on{display:flex}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r2);background:var(--s3);color:var(--tx);font-weight:600;font-size:16px;text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.pri{background:var(--ac);color:var(--actx)}
.btn.grow{flex:1}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--ac);padding:0 8px;min-height:44px}
.btn.bad{background:rgba(255,90,78,.13);color:var(--bad)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn .n{background:var(--ac);color:var(--actx);border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.cab2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.cab2 .kick{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab2 .seg{flex:none}
.h1c{font-size:27px;margin:0 0 14px}
.kick{color:var(--tx2);font-size:13px;font-weight:600;margin-bottom:4px}
.kick::first-letter{text-transform:uppercase}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap;text-align:center}
.seg button.on{background:var(--s4);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.seg.chica button{min-height:32px;font-size:13px;padding:0 12px;flex:1 1 auto}
.seg.auto button{flex:1 1 auto;padding:0 10px}
.lab{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin:20px 2px 9px}
.lab.c{margin:16px 2px 8px}
.lab small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx3);margin-left:6px;font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.wx{display:flex;align-items:center;gap:12px;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wx:active{background:var(--s2)}
.wx .e{font-size:29px;line-height:1;width:36px;text-align:center;flex:none}
.wx .t{font-size:21px;font-weight:700;letter-spacing:-.02em}
.wx .t small{font-size:13px;color:var(--tx2);font-weight:500;letter-spacing:0;margin-left:5px}
.wx .s{font-size:14px;color:var(--tx2);margin-top:2px}
.wx .go{margin-left:auto;color:var(--tx3)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--acbg);color:var(--ac);vertical-align:3px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:7px}
.plan{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:8px 4px;border-radius:var(--r2);background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:12px;text-align:center;transition:transform .12s;overflow:hidden;min-width:0}
.plan:active{transform:scale(.97)}
.plan .pi{width:34px;height:34px;border-radius:10px;background:var(--s3);display:grid;place-items:center;color:var(--pcl,var(--tx2));flex:none}
.plan span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.plan.on{background:color-mix(in srgb,var(--pcf) 30%,var(--s1));border-color:var(--pcl)}
.plan.on .pi{background:var(--pcf);color:#fff}
.variantes{margin-top:8px}
.variantes .seg button.on{background:var(--pc,#313137);color:#fff}
.btn.pc{background:var(--pc,var(--ac));color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 15px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--tx2)}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.x{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.x::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap;flex:none}
.chip.on{background:var(--acbg);border-color:rgba(217,168,108,.55);color:var(--ac2)}
.chip .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.28);flex:none}
.chip .c{color:var(--tx3);font-weight:700}
.porque{margin:18px 2px 10px;font-size:15px;line-height:1.45}
.aviso{display:flex;gap:10px;align-items:flex-start;background:rgba(255,179,64,.1);color:var(--warn);border-radius:var(--r3);padding:10px 12px;font-size:14px;margin-bottom:10px}
.outfit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pz{position:relative;display:block;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;transition:transform .12s,border-color .15s}
button.pz:active{transform:scale(.97)}
.pz.on{border-color:rgba(217,168,108,.65)}
.ph{aspect-ratio:1/1;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.glyph{width:64%;height:64%}
.pz .nm{padding:7px 8px 9px}
.pz .n1{font-size:12.5px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:31px}
.pz .n2{font-size:11px;color:var(--tx3);margin-top:2px}

HOJAS.exportar = () => ({ titulo: 'Copia de seguridad', html: `<p class="muted" style="margin-top:0">Guarda el archivo en <b style="color:var(--tx)">Archivos, en iCloud Drive</b>. Si cambias de móvil o se borra algo, lo importas desde Perfil y recuperas todo.</p><div class="card" style="margin:14px 0"><div style="font-weight:600;word-break:break-all">${esc(S.exp.nombre)}</div><div class="muted">${S.exp.n} prendas · ${num(S.exp.size / 1048576)} MB</div></div><button class="btn pri big" data-act="x-compartir">${ico('bajar', 's')} Guardar copia</button>` });
async function compartirExport() {
  const { nombre, json } = S.exp;
  const intentos = [new File([json], nombre, { type: 'application/json' }), new File([json], nombre, { type: 'text/plain' })];
  for (const file of intentos) {
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Copia de Mi Armario' });
        marcarCopia(); return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const url = URL.createObjectURL(intentos[0]);
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000); marcarCopia();
  } catch (e) { toast('No se pudo guardar la copia'); }
}
function marcarCopia() { S.meta.ultimaCopia = isoDia(); guardarKV('meta', S.meta); cerrarHoja(); render(); toast('Copia guardada'); }
async function importarArchivo(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Ese archivo no es una copia válida'); return; }
  if (!data || data.app !== 'mi-armario-diario' || !Array.isArray(data.prendas)) { toast('Ese archivo no es de Mi Armario'); return; }
  const modo = await dialogo({ titulo: 'Importar copia', texto: `${data.prendas.length} prendas${data.planes ? `, ${data.planes.length} planes` : ''}. ¿Qué hago con lo que ya tienes?`, botones: [{ label: 'Añadir a lo que tengo', valor: 'sumar', estilo: 'pri' }, { label: 'Reemplazar todo', valor: 'reemplazar', estilo: 'bad' }, { label: 'Cancelar', valor: null }] });
  if (!modo) return;
  if (modo === 'reemplazar') { await borrarTodoDatos(true); }
  const nuevas = [];
  for (const raw of data.prendas) {
    const p = normalizarPrenda({ ...raw, foto: false });
    if (typeof raw.fotoData === 'string' && raw.fotoData.startsWith('data:')) {
      try { const [cab, b64] = raw.fotoData.split(','); const type = (cab.match(/data:([^;]+)/) || [])[1] || 'image/jpeg'; await guardarFoto(p.id, b64ABuf(b64), type); limpiarURL(p.id); p.foto = true; } catch (e) { }
    } else { const prev = S.prendas.find(x => x.id === p.id); if (prev && prev.foto) p.foto = true; }
    nuevas.push(p);
  }
  for (const p of nuevas) { const i = S.prendas.findIndex(x => x.id === p.id); if (i >= 0) S.prendas[i] = p; else S.prendas.push(p); }
  await DB.putMany('prendas', nuevas).catch(errorGuardado);
  if (Array.isArray(data.planes) && data.planes.length) {
    const pls = data.planes.map(normalizarPlan);
    if (modo === 'reemplazar') S.planes = pls; else for (const pl of pls) { const i = S.planes.findIndex(x => x.id === pl.id); if (i >= 0) S.planes[i] = pl; else S.planes.push(pl); }
    await guardarKV('planes', S.planes);
  }
  if (data.perfil) { S.perfil = { ...S.perfil, ...data.perfil, ubicacion: { ...S.perfil.ubicacion, ...(data.perfil.ubicacion || {}) } }; await guardarKV('perfil', S.perfil); }
  if (data.reglas) { S.reglas = { ...S.reglas, ...data.reglas }; await guardarKV('reglas', S.reglas); }
  if (Array.isArray(data.historial)) {
    const hs = data.historial.filter(x => x && x.id && x.fecha);
    for (const x of hs) { if (!S.historial.some(y => y.id === x.id)) S.historial.push(x); }
    S.historial.sort((a, b) => a.ts - b.ts);
    await DB.putMany('historial', hs).catch(errorGuardado);
  }
  pedirPersistencia();
  S.ui.planId = null; S.ui.locks = {}; invalidar(); render();
  toast(`Importadas ${nuevas.length} prendas`);
}
async function borrarTodoDatos(silencio) {

let toastTimer = null;
function toast(msg, opts = {}) {
  const root = $('#toast'); clearTimeout(toastTimer);
  root.innerHTML = `<div class="t" role="status"><span>${esc(msg)}</span>${opts.accion ? `<button>${esc(opts.accion)}</button>` : ''}</div>`;
  const t = root.firstChild;
  const ocultar = () => { t.classList.remove('vis'); setTimeout(() => { if (root.firstChild === t) root.innerHTML = ''; }, 250); };
  if (opts.accion) t.querySelector('button').onclick = () => { clearTimeout(toastTimer); ocultar(); if (opts.fn) opts.fn(); };
  requestAnimationFrame(() => t.classList.add('vis'));
  toastTimer = setTimeout(ocultar, opts.ms || (opts.accion ? 5500 : 2600));
}

async function meLoPongo() {
  const r = S.ui.sug; if (!r || !r.lista.length) return;
  const k = r.lista[S.ui.idx]; const piezas = piezasDe(k.sel);
  const fecha = fechaObjetivo();
  const antes = piezas.map(p => ({ ...p }));
  const prevUI = { sug: S.ui.sug, idx: S.ui.idx, locks: { ...S.ui.locks } };
  for (const p of piezas) {
    p.usos = (p.usos || 0) + 1;
    if (!p.ultimoUso || p.ultimoUso < fecha) p.ultimoUso = fecha;
    if (p.usosMax > 0 && p.usos >= p.usosMax) p.estado = 'sucia';
  }
  const cl = r.ctx.clima, pl = r.ctx.plan;
  const h = { id: uid(), fecha, ts: Date.now(), planId: pl.id, franja: r.ctx.franja, clima: { tMin: cl.tMin, tMax: cl.tMax, lluvia: cl.lluvia }, prendas: piezas.map(p => p.id), fb: null };
  S.historial.push(h);
  await Promise.all([DB.putMany('prendas', piezas), DB.put('historial', h)]).catch(errorGuardado);
  S.ui.puesto = { hid: h.id, sel: { ...k.sel }, etiqueta: `Apuntado para ${S.ui.dia === 'hoy' ? 'hoy' : 'mañana'} · ${pl.grupo} · ${FRANJAS[r.ctx.franja].label.toLowerCase()}` };
  S.ui.locks = {}; invalidar(); render();
  toast('Que vaya bien', {
    accion: 'Deshacer', fn: async () => {
      for (const a of antes) { const p = S.prendas.find(x => x.id === a.id); if (p) Object.assign(p, a); }
      S.historial = S.historial.filter(x => x.id !== h.id);
      await Promise.all([DB.putMany('prendas', S.prendas.filter(p => antes.some(a => a.id === p.id))), DB.del('historial', h.id)]).catch(() => {});
      S.ui.puesto = null; S.ui.sug = prevUI.sug; S.ui.idx = prevUI.idx; S.ui.locks = prevUI.locks; render();
    }
  });
}

  'c-toggle': el => { const id = el.dataset.id; if (S.coladaSel.has(id)) S.coladaSel.delete(id); else S.coladaSel.add(id); refrescarHoja(); },
  'c-ok': () => confirmarColada(),
  'u-modo': el => { const v = el.dataset.v; S.perfil.ubicacion.modo = v; guardarKV('perfil', S.perfil); refrescarHoja(); if (v !== 'ciudad' || S.perfil.ubicacion.lat != null) { S.manual = null; cargarClima(true); } },
  'u-buscar': () => hacerBusquedaCiudad(),
  'u-ciudad': el => { const r = S.uRes[+el.dataset.i]; if (!r) return; S.perfil.ubicacion = { modo: 'ciudad', nombre: r.nombre, lat: r.lat, lon: r.lon }; guardarKV('perfil', S.perfil); S.uRes = []; S.manual = null; cerrarHoja(); cargarClima(true); toast(`Tiempo de ${r.nombre}`); },
  'm-paso': el => { const m = S.mf, k = el.dataset.k; m[k] = Math.max(-15, Math.min(45, m[k] + (+el.dataset.d))); if (m.tMin > m.tMax) { if (k === 'tMin') m.tMax = m.tMin; else m.tMin = m.tMax; } refrescarHoja(); },
  'm-lluvia': el => { S.mf.lluvia = +el.dataset.v; refrescarHoja(); },
  'm-usar': () => { S.manual = { ...S.mf }; S.ui.locks = {}; S.ui.puesto = null; S.ui.idx = 0; invalidar(); cerrarHoja(); render(); },
  'm-auto': () => { S.manual = null; invalidar(); cerrarHoja(); render(); },
  'm-recargar': () => { S.manual = null; cerrarHoja(); cargarClima(true); toast('Actualizando el tiempo…'); },
  'p-sens': el => { S.perfil.sensacion = el.dataset.v; guardarKV('perfil', S.perfil); invalidar(); render(); },
  'p-reset-ap': () => { S.perfil.aprendido = 0; guardarKV('perfil', S.perfil); invalidar(); render(); },
  'p-pref': el => { toggleArr(S.perfil.prefiero, el.dataset.v); S.perfil.evito = S.perfil.evito.filter(x => x !== el.dataset.v); guardarKV('perfil', S.perfil); invalidar(); render(); },
  'p-evito': el => { toggleArr(S.perfil.evito, el.dataset.v); S.perfil.prefiero = S.perfil.prefiero.filter(x => x !== el.dataset.v); guardarKV('perfil', S.perfil); invalidar(); render(); },
  'p-corte': el => { toggleArr(S.perfil.cortesEvito, el.dataset.v); guardarKV('perfil', S.perfil); invalidar(); render(); },
  'p-plan': el => abrirPlan(el.dataset.id),
  'p-plan-nuevo': () => abrirPlan(null),
  'r-calzado': () => { S.reglas.noRepetirCalzado = !S.reglas.noRepetirCalzado; guardarKV('reglas', S.reglas); invalidar(); render(); },
  'r-dias': el => { S.reglas.diasSinRepetir = Math.max(0, Math.min(7, S.reglas.diasSinRepetir + (+el.dataset.d))); guardarKV('reglas', S.reglas); invalidar(); render(); },
  'p-export': () => prepararExport(),
  'p-import': () => $('#inImport').click(),
  'x-compartir': () => compartirExport(),
  'p-ejemplo': () => cargarEjemplo(),
  'p-quitar-ejemplo': () => quitarEjemplo(),
  'p-instalar': () => abrirHoja('instalar'),
  'p-borrar-todo': async () => {
    const a = await dialogo({ titulo: '¿Borrar todos los datos?', texto: 'Se borran prendas, fotos, historial y ajustes de este móvil.', botones: [{ label: 'Sí, borrar todo', valor: true, estilo: 'bad' }, { label: 'Cancelar', valor: false }] });
    if (!a) return;
    const b = await dialogo({ titulo: 'Última confirmación', texto: 'No se puede deshacer. Si tienes copia, podrás importarla luego.', botones: [{ label: 'Borrar definitivamente', valor: true, estilo: 'bad' }, { label: 'Cancelar', valor: false }] });
    if (!b) return;
    await borrarTodoDatos(false); render(); toast('Datos borrados');
  },
  'pl-grupo': el => { S.pf.grupo = el.dataset.v; const p0 = S.planes.find(p => p.grupo === el.dataset.v); if (p0) { S.pf.icono = p0.icono; S.pf.color = p0.color; } refrescarHoja(); },
  'pl-color': el => { S.pf.color = el.dataset.v; refrescarHoja(); },
  'pl-deporte': () => { S.pf.deporte = !S.pf.deporte; refrescarHoja(); },
  'pl-arreglo': () => { S.pf.arreglo = !S.pf.arreglo; refrescarHoja(); },
  'moto': () => { S.meta.moto = !S.meta.moto; guardarKV('meta', S.meta); S.ui.locks = {}; S.ui.puesto = null; S.ui.idx = 0; invalidar(); render(); },
  'barba-hecho': () => { S.meta.ultimoAfeitado = isoDia(); guardarKV('meta', S.meta); render(); toast('Apuntado: barba repasada hoy'); },
  'barba-dia': el => { S.meta.ultimoAfeitado = addDias(isoDia(), -(+el.dataset.v)); guardarKV('meta', S.meta); render(); },
  'p-repaso': el => { S.perfil.repasoCada = Math.max(2, Math.min(14, (S.perfil.repasoCada || 4) + (+el.dataset.d))); guardarKV('perfil', S.perfil); render(); },
  'pl-icono': el => { S.pf.icono = el.dataset.v; refrescarHoja(); },
  'pl-paso': el => { const f = S.pf, k = el.dataset.k; f[k] = Math.max(1, Math.min(5, f[k] + (+el.dataset.d))); if (f.min > f.max) { if (k === 'min') f.max = f.min; else f.min = f.max; } refrescarHoja(); },
  'pl-traje': () => { S.pf.traje = !S.pf.traje; S.pf.sinMedia = S.pf.traje; refrescarHoja(); },
  'pl-franja': el => { S.pf.franja = el.dataset.v || null; refrescarHoja(); },
  'pl-excl': el => { toggleArr(S.pf.excluir, el.dataset.v); refrescarHoja(); },
  'pl-guardar': () => guardarPlanForm(),
  'pl-borrar': () => borrarPlanForm(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast('Algo ha fallado. Prueba otra vez.'); }); }
  catch (err) { console.error(err); toast('Algo ha fallado. Prueba otra vez.'); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.campo) {
    const c = el.dataset.campo;
    if (c.startsWith('pf.')) { if (S.pf) S.pf[c.slice(3)] = el.value; }
    else if (S.form) S.form[c] = el.value;
  }
  if (el.id === 'u-q') S.uq = el.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'u-q') { e.preventDefault(); hacerBusquedaCiudad(); } });
document.addEventListener('toggle', e => { if (!e.target) return; if (e.target.id === 'f-det' && S.form) S.form.abierto = e.target.open; if (e.target.id === 'p-col') S.ui.colAbierto = e.target.open; }, true);
$('#inFoto').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file || !S.form) return;
  try {
    const { blob, colores } = await procesarFoto(file);
    if (!S.form) return;
    if (S.form.fotoURL) URL.revokeObjectURL(S.form.fotoURL);
    S.form.fotoBlob = blob; S.form.fotoURL = URL.createObjectURL(blob); S.form.sugColores = colores;
    if (colores.length && (!S.form.color || !S.form.id)) { S.form.color = colores[0]; S.form.verPaleta = false; }
    refrescarHoja();
  } catch (err) { toast('No he podido leer esa foto. Prueba con otra.'); }
});
$('#inImport').addEventListener('change', async e => { const file = e.target.files && e.target.files[0]; e.target.value = ''; if (file) importarArchivo(file).catch(() => toast('No se pudo importar')); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.ui.hoyFecha !== isoDia()) render();
  if (!S.clima.ts || Date.now() - S.clima.ts > 30 * 60 * 1000) cargarClima(false);
});

/* ============ ARRANQUE ============ */
async function iniciar() {
  await cargar();
  if (S.climaCache && S.climaCache.datos) S.clima = { estado: 'viejo', datos: S.climaCache.datos, ubic: null, ts: S.climaCache.ts };
  render();
  cargarClima(false);
  if ('serviceWorker' in navigator && !EN_IFRAME && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
window.__armario = { S, generarSugerencias, contexto, W, justificar, resumenClima, detectarColores, cargarClima, render, version: APP_VERSION };
iniciar();
})();
</script>
</body>
</html>
